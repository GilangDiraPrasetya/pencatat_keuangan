name: pencatat-keuangan-bot

# Bot dijalankan sebagai job GitHub Actions (gratis utk repo public).
# Jadwal tiap 6 jam: job hidup ~5jam55, lalu run berikutnya mengakhirinya →
# gap koneksi < beberapa menit. Bisa juga dijalankan manual via workflow_dispatch.

on:
  workflow_dispatch:
  push:
    branches: [main] # deploy otomatis tiap push
  schedule:
    - cron: '0 */6 * * *' # UTC 0/6/12/18 = 07/13/19/01 WIB

concurrency:
  group: discord-bot
  cancel-in-progress: true # pastikan hanya ada 1 instance bot (dua login token = flicker)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # ~5 jam 55 menit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Jalankan bot (auto-restart bila crash)
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          BOT_TIMEZONE: Asia/Jakarta
          MONEY_CHANNEL_ID: ${{ secrets.MONEY_CHANNEL_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          while true; do
            echo "[bot] meluncur $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            node src/index.js || echo "[bot] keluar, restart dalam 5 detik..."
            sleep 5
          done
